name: RVC CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 手动全量验证入口：无需伪造前端改动即可审计 L3 在 CI 的可执行性
  workflow_dispatch:
    inputs:
      full_verify:
        description: 强制完整验证（含 L3 headless 前端验收）
        type: boolean
        default: false

jobs:
  verify:
    runs-on: macos-latest
    steps:
      # fetch-depth: 0 —— 前端变更检测需要与 base 做 diff（push 用 before，PR 用 base.sha）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: brew install ffmpeg

      # 回退闸门判据：前端（reader-video-companion/）有变更时 L3 必须跑，否则本地
      # --no-verify 绕过 pre-push 钩子后前端行为验证就彻底缺失（只有 L3 覆盖前端）
      - name: Detect frontend changes
        id: frontend
        env:
          # event 字段经环境变量传入（不直接插值进 shell）；push 用 before（推送前主干），PR 用 base.sha
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
        run: |
          bash scripts/ci-frontend-changed.sh "$BASE_SHA" | tee /tmp/rvc-frontend-detect.log
          echo "changed=$(grep '^changed=' /tmp/rvc-frontend-detect.log | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "reason=$(grep '^reason=' /tmp/rvc-frontend-detect.log | cut -d= -f2-)" >> "$GITHUB_OUTPUT"

      # L0（静态+sha256 冻结核对）+ L1（单测）+ L2（真实进程 E2E），分层与冻结边界原样保留
      - name: Run tests (L0+L1+L2)
        run: bash run_tests.sh

      # L3 需要 Playwright chromium（headless 新模式支持加载扩展），仅前端变更/手动全量时安装
      - name: Setup Playwright (L3 headless)
        if: steps.frontend.outputs.changed == 'yes' || github.event.inputs.full_verify == 'true'
        run: |
          python3 -m pip install --break-system-packages playwright
          python3 -m playwright install chromium

      # L3 前端行为验收（headless，冻结基准 acceptance.py）—— CI 回退闸门的执行端：
      # 失败即本 job 红，配合 main 分支 required check（Settings→Branches→Require status
      # checks）后，git push --no-verify 不再能绕过前端行为验证
      - name: L3 frontend acceptance (headless gate)
        if: steps.frontend.outputs.changed == 'yes' || github.event.inputs.full_verify == 'true'
        run: bash scripts/ci-l3.sh

      # 可审计运行证据：L3 完整日志 + 汇总 + 变更判定，任何结果（含失败）都归档
      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rvc-ci-evidence
          path: |
            /tmp/rvc-l3.log
            /tmp/rvc-l3.summary
            /tmp/rvc-frontend-detect.log
          if-no-files-found: ignore
